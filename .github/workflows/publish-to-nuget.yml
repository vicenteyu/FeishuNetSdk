name: Publish NuGet Package

on:
  push:
    tags:
      - 'v*'

env:
  PROJECT_PATH: src/FeishuNetSdk.csproj

jobs:
  build-and-test:
    name: Build & Test (.NET 8/9/10)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        dotnet-version: ['8.0.x', '9.0.x', '10.0.x']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet-version }}
          cache: true
          cache-dependency-path: ${{ env.PROJECT_PATH }}

      - name: Restore & Build
        run: |
          dotnet restore ${{ env.PROJECT_PATH }}
          dotnet build ${{ env.PROJECT_PATH }} -c Release --no-restore

      - name: Run tests
        run: dotnet test ${{ env.PROJECT_PATH }} -c Release --no-build

      - name: Pack
        if: matrix.dotnet-version == '10.0.x'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          dotnet pack ${{ env.PROJECT_PATH }} -c Release -p:PackageVersion=$VERSION -o ./nupkg

      - name: Upload Artifact
        if: matrix.dotnet-version == '10.0.x'
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: ./nupkg/*.nupkg

  publish:
    name: Publish NuGet & Release
    needs: build-and-test
    runs-on: ubuntu-latest
    
    # 🔴 修改点 1：必须添加 id-token 的 write 权限，用于获取 NuGet 临时密钥
    # 同时也需要 contents 和 packages 的相应权限来维持后面的 GitHub Release 和 GitHub Packages 推送
    permissions:
      id-token: write
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: nuget-package
          path: ./nupkg

      - name: Generate Commit Log
        run: |
          echo "### 📜 详细更新记录 (Detailed Changes)" > auto_gen_log.txt
          
          # 获取上一个标签
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)
          
          git log $PREV_TAG..HEAD --format="%B" | \
            grep -ivE "^v?[0-9]+(\.[0-9]+)+$" | \
            grep -ivE "Merge branch|Merge pull request" | \
            sed '/^[[:space:]]*$/d' >> auto_gen_log.txt || true

      # 🔴 修改点 2：在推送前使用官方 Action 登录 NuGet
      - name: NuGet login
        uses: NuGet/login@v1
        with:
          user: vicente # 填入你的 NuGet 用户名

      # 🔴 修改点 3：去掉了原本的 --api-key ${{ secrets.NUGET_API_KEY }} 
      - name: Push to NuGet
        run: dotnet nuget push ./nupkg/*.nupkg --source https://api.nuget.org/v3/index.json --skip-duplicate

      # 🟢 提示：发往 GitHub Packages 的密钥不需要变，依旧保持使用内置的 ${{ secrets.GITHUB_TOKEN }}
      - name: Push to GitHub Packages
        run: dotnet nuget push ./nupkg/*.nupkg --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./nupkg/*.nupkg
          body_path: changelog.md
          append_body: true
          body: |
            
            $(cat auto_gen_log.txt)
          prerelease: ${{ contains(github.ref_name, 'preview') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}