name: Publish NuGet Package

on:
  push:
    tags:
      - 'v*'

env:
  PROJECT_PATH: src/FeishuNetSdk.csproj

jobs:
  build-and-test:
    name: Build & Test (.NET 8/9/10)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        dotnet-version: ['8.0.x', '9.0.x', '10.0.x']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet-version }}
          cache: true
          cache-dependency-path: ${{ env.PROJECT_PATH }}

      - name: Restore & Build
        run: |
          dotnet restore ${{ env.PROJECT_PATH }}
          dotnet build ${{ env.PROJECT_PATH }} -c Release --no-restore

      - name: Run tests
        run: dotnet test ${{ env.PROJECT_PATH }} -c Release --no-build

      - name: Pack
        if: matrix.dotnet-version == '10.0.x'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          dotnet pack ${{ env.PROJECT_PATH }} -c Release -p:PackageVersion=$VERSION -o ./nupkg

      - name: Upload Artifact
        if: matrix.dotnet-version == '10.0.x'
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: ./nupkg/*.nupkg

  publish:
    name: Publish NuGet & Release
    needs: build-and-test
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: nuget-package
          path: ./nupkg

      # 🟢 核心改动：在独立发布的 Job 里，初始化一次 .NET 10 环境并绑定官方源
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          source-url: https://api.nuget.org/v3/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }} 

      # 🟢 核心改动：安全登录换取 OIDC Token
      - name: NuGet login
        uses: NuGet/login@v1
        with:
          user: vicente 

      # 🟢 核心改动：极简推送（不带任何干扰参数，防止 V2 降级 Bug）
      - name: Push to NuGet
      run: dotnet nuget push ./nupkg/*.nupkg --source https://api.nuget.org/v3-index/index.json --api-key $NUGET_AUTH_TOKEN --skip-duplicate

      # -------------------------------------------------------------
      # 保持你原本的 GitHub Packages 和 Release 逻辑完全不动
      - name: Generate Commit Log
        run: |
          echo "### 📜 详细更新记录 (Detailed Changes)" > auto_gen_log.txt
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)
          git log $PREV_TAG..HEAD --format="%B" | grep -ivE "^v?[0-9]+(\.[0-9]+)+$" | grep -ivE "Merge branch|Merge pull request" | sed '/^[[:space:]]*$/d' >> auto_gen_log.txt || true

      - name: Push to GitHub Packages
        run: dotnet nuget push ./nupkg/*.nupkg --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./nupkg/*.nupkg
          body_path: changelog.md
          append_body: true
          body: |
            $(cat auto_gen_log.txt)
          prerelease: ${{ contains(github.ref_name, 'preview') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}